<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Garden Match Road</title>
  <link rel="preload" as="image" href="road-stone-v2.webp">
  <link rel="preload" as="image" href="road-stone-split.webp">
  <link rel="preload" as="image" href="hammer-tool.webp">
  <link rel="preload" as="image" href="character-celebrate-jump.webp">
  <style>
    @font-face { font-family:"MuseoModerno"; src:url("MuseoModerno.ttf") format("truetype"); font-weight:100 900; font-style:normal; font-display:swap; }
    :root { color-scheme: light; font-family: Inter, ui-rounded, "PingFang SC", system-ui, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout:none; user-select: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #102814; }
    body { display: grid; place-items: center; }
    #game {
      position: relative; height:100vh; height:100dvh; width:min(100vw,56.22vh); width:min(100vw,56.22dvh); overflow:hidden;
      background:#72b833; box-shadow:0 0 40px #07180b; touch-action:none; overscroll-behavior:none;
    }
    #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 50; color: white; background: #5cac32; font-weight: 900; letter-spacing: .06em; transition: opacity .25s; }
    #hud { position:absolute; z-index:20; left:6.3%; right:6.3%; top:3.8%; top:max(3.8%,env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:center; }
    .pill { border: 3px solid rgba(255,255,255,.92); background: rgba(250,249,228,.94); color: #305122; border-radius: 999px; box-shadow: 0 4px 10px #234b2470; font-weight: 900; }
    #wallet { flex:0 0 32.05%; height:clamp(40px,5.8vh,54px); height:clamp(40px,5.8dvh,54px); padding:3px 10px 3px 5px; display:flex; align-items:center; justify-content:center; gap:4px; color:#626262; font-family:"MuseoModerno",sans-serif; font-size:clamp(18px,2.6vh,28px); font-size:clamp(18px,2.6dvh,28px); font-weight:800; line-height:1; }
    #wallet img { flex:0 0 34%; width:34%; height:auto; margin-top:2px; filter:drop-shadow(0 2px 1px #17391b40); }
    #walletAmount { min-width:0; text-align:center; font-variant-numeric:tabular-nums; }
    #counter { display:none; }
    #reset { width:48px; height:48px; border:0; display:grid; place-items:center; cursor:pointer; }
    #reset svg { width:58%; height:58%; display:block; fill:#305122; }
    #hint { position: absolute; z-index: 21; top: 12%; left: 50%; transform: translateX(-50%); padding: 7px 14px; color:#626262; font-family:"MuseoModerno",sans-serif; font-size:14px; font-weight:900; -webkit-text-stroke:.2px #626262; white-space:nowrap; animation:bob 1.2s ease-in-out infinite; }
    #moveResult { position:absolute; z-index:23; left:50%; top:21.5%; display:flex; align-items:center; gap:3px; opacity:0; color:#fff; font-family:"MuseoModerno",sans-serif; font-size:clamp(18px,5vw,28px); font-weight:800; letter-spacing:.01em; text-shadow:0 2px 2px #173d20cc,0 4px 7px #173d2070; transform:translate(-50%,-50%) scale(.7); pointer-events:none; }
    #moveResult img { width:clamp(48px,12vw,72px); height:auto; filter:drop-shadow(0 3px 2px #2d2b1466); }
    #moveResult.show { animation:moveResultPop 1.35s ease-out; }
    @keyframes moveResultPop { 0% { opacity:0; transform:translate(-50%,-40%) scale(.55); } 18%,72% { opacity:1; transform:translate(-50%,-50%) scale(1); } 100% { opacity:0; transform:translate(-50%,-68%) scale(.94); } }
    @keyframes bob { 50% { transform: translate(-50%, -4px); } }
    #board, #road, #fx { position: absolute; inset: 0; }
    #road, #fx, #hero, #heroShadow { pointer-events: none; }
    .tile, .road-tile, .fly-tile, .pave-tile { position: absolute; height: auto; transform: translate(-50%,-50%); filter: drop-shadow(0 3px 2px #2d2b1455); will-change: left,top,transform,opacity; }
    .tile { width:22.5%; }
    .road-tile, .fly-tile, .pave-tile { width:13.5%; }
    .tile { z-index: 7; cursor: grab; clip-path: inset(20% 25% 18% 25%); transition: left .23s cubic-bezier(.2,.8,.25,1), top .23s cubic-bezier(.2,.8,.25,1), transform .13s, opacity .15s; }
    .tile.yellow { filter:drop-shadow(0 3px 2px #58380065); }
    .road-tile.yellow, .fly-tile.yellow, .pave-tile.yellow { filter: hue-rotate(198deg) saturate(2.2) brightness(1.42) drop-shadow(0 3px 2px #58380065); }
    .tile.red { filter:hue-rotate(148deg) saturate(1.28) brightness(.9) drop-shadow(0 3px 2px #4b171765); }
    .tile.selected { transform: translate(-50%,-58%) scale(1.08); filter: drop-shadow(0 0 7px white) drop-shadow(0 4px 3px #1e442c88); }
    .tile.yellow.selected { filter:drop-shadow(0 0 7px white) drop-shadow(0 4px 3px #58380065); }
    .tile.red.selected { filter:hue-rotate(148deg) saturate(1.28) brightness(.9) drop-shadow(0 0 7px white) drop-shadow(0 4px 3px #4b171765); }
    .tile.clear { transform: translate(-50%,-70%) scale(.15) rotate(18deg); opacity: 0; }
    .road-tile { z-index: 8; transform:translate(-50%,-50%) scale(var(--sx,1),var(--sy,1)); animation:land .16s ease-out both; }
    .road-tile.settled { animation:none; }
    @keyframes land { from { opacity:.45; } to { opacity:1; } }
    .road-tile.settled.shattered { animation:stoneShatterAway .42s cubic-bezier(.18,.76,.17,1) forwards; }
    @keyframes stoneShatterAway { 0% { opacity:1; transform:translate(-50%,-50%) scale(var(--sx,1),var(--sy,1)) scale(1); filter:brightness(1.55) drop-shadow(0 4px 3px #2d2b1466); } 20% { transform:translate(-50%,-50%) scale(var(--sx,1),var(--sy,1)) scale(1.06,.98); } 58% { opacity:1; transform:translate(-50%,-45%) scale(var(--sx,1),var(--sy,1)) scale(1.08); } 100% { opacity:0; transform:translate(-50%,-31%) scale(var(--sx,1),var(--sy,1)) scale(.86) rotate(3deg); filter:brightness(1.05) drop-shadow(0 1px 1px #2d2b1422); } }
    .fly-tile { z-index:8; pointer-events: none; transition: left .46s cubic-bezier(.35,.05,.2,1), top .46s cubic-bezier(.35,.05,.2,1), transform .46s cubic-bezier(.2,1.2,.3,1), opacity .46s; }
    .pave-tile { z-index:8; pointer-events:none; transition:left .16s ease-out,top .16s ease-out,transform .16s ease-out,opacity .16s; }
    .cash-hover-shadow { position:absolute; z-index:9; width:6.2%; height:.85%; border-radius:50%; transform:translate(-50%,-50%); background:#18391b72; filter:blur(2px); animation:cashShadowFloat 1.65s ease-in-out infinite; pointer-events:none; }
    .cash { position:absolute; z-index:9; width:9.5%; height:auto; transform:translate(-50%,-74%); transform-origin:50% 72%; filter:drop-shadow(0 7px 4px #17391b66); animation:cashFloat 1.65s ease-in-out infinite; }
    .cash.collected { animation:cashCollect .42s ease-in forwards; }
    .cash-hover-shadow.collected { animation:none; opacity:0; transform:translate(-50%,-50%) scale(.3); transition:opacity .24s,transform .24s; }
    @keyframes cashFloat { 0%,100% { transform:translate(-50%,-74%) rotate(-1.2deg); } 50% { transform:translate(-50%,-96%) rotate(1.2deg); } }
    @keyframes cashShadowFloat { 0%,100% { opacity:.38; transform:translate(-50%,-50%) scale(1); } 50% { opacity:.2; transform:translate(-50%,-50%) scale(.72); } }
    @keyframes cashCollect { 0% { opacity:1; transform:translate(-50%,-112%) scale(1); } 100% { opacity:0; transform:translate(-50%,-185%) scale(1.38) rotate(7deg); } }
    .mystery-hover { position:absolute; z-index:9; width:10.5%; aspect-ratio:1; transform:translate(-50%,-84%); pointer-events:none; animation:mysteryFloat 1.8s ease-in-out infinite; will-change:transform; }
    .mystery-image { display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 7px 5px #6c430080); }
    .mystery-hover.collected { animation:mysteryCollect .3s ease-in forwards; }
    @keyframes mysteryFloat { 0%,100% { transform:translate(-50%,-84%); } 50% { transform:translate(-50%,-96%); } }
    @keyframes mysteryCollect { to { opacity:0; transform:translate(-50%,-135%) scale(.3); } }
    #heroShadow { position: absolute; z-index: 10; width: 9%; height: 2.4%; border-radius: 50%; background: #17331452; filter: blur(2px); transform: translate(-50%,-50%); transition: left .18s linear, top .18s linear, transform .12s, opacity .12s; }
    #hero { --face:1; position: absolute; z-index: 12; width: 13%; height: auto; transform: translate(-50%,-88%) scaleX(var(--face)); transform-origin: 50% 100%; filter: drop-shadow(0 2px 2px #1b2d2040); transition:left .18s linear,top .18s linear; will-change: left,top,transform; }
    #hero.board-overlap { -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.42) 0 58%,rgba(0,0,0,.72) 70%,#000 86%); mask-image:linear-gradient(to bottom,rgba(0,0,0,.42) 0 58%,rgba(0,0,0,.72) 70%,#000 86%); }
    #hero.jump { animation: hop .20s ease-out; }
    #hero.finish-jump { animation: finishHop .34s cubic-bezier(.2,.72,.25,1); }
    #hero.celebrate { animation:celebrateHop .58s ease-in-out infinite; }
    @keyframes hop { 0%,100% { transform:translate(-50%,-88%) scaleX(var(--face)); } 48% { transform:translate(-50%,-111%) scaleX(var(--face)) scale(.97,1.03); } }
    @keyframes finishHop { 0% { transform:translate(-50%,-88%) scaleX(var(--face)); } 42% { transform:translate(-50%,-116%) scaleX(var(--face)) scale(.95,1.06); } 72% { transform:translate(-50%,-82%) scaleX(var(--face)) scale(1.09,.86); } 100% { transform:translate(-50%,-88%) scaleX(var(--face)); } }
    @keyframes celebrateHop { 0%,100% { transform:translate(-50%,-88%) scaleX(var(--face)) scale(1); } 48% { transform:translate(-50%,-125%) scaleX(var(--face)) scale(.95,1.06) rotate(2deg); } }
    #moneyLabel { position:absolute; z-index:40; width:clamp(64px,16%,104px); height:auto; opacity:0; filter:drop-shadow(0 3px 4px #17391b88); transform:translate(-50%,-50%) scale(.6); pointer-events:none; }
    #moneyLabel.show { animation: moneyPop .85s ease-out; }
    @keyframes moneyPop { 0% { opacity:0; transform:translate(-50%,-10%) scale(.4); } 25%,70% { opacity:1; transform:translate(-50%,-70%) scale(1.1); } 100% { opacity:0; transform:translate(-50%,-120%) scale(.9); } }
    .bill { position:absolute; z-index:38; width:16px; height:9px; border:2px solid #eaffb9; border-radius:2px; background:#25b967; pointer-events:none; animation: rain .9s ease-out forwards; }
    @keyframes rain { 0% { opacity:0; transform:translate(-50%,-20px) rotate(0); } 15% { opacity:1; } 100% { opacity:0; transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); } }
    .hammer-strike { position:absolute; z-index:44; width:15%; height:auto; transform-origin:82% 78%; filter:drop-shadow(0 5px 3px #38281870); pointer-events:none; opacity:0; will-change:transform,opacity; }
    .hammer-strike.preparing { animation:hammerPrepare .52s cubic-bezier(.4,0,.28,1) forwards; }
    .hammer-strike.slamming { animation:hammerSlam .2s cubic-bezier(.66,0,.96,.34) forwards; }
    .hammer-strike.contact { opacity:1; transform:translate(-17.6%,-76%) rotate(-24deg) scale(1); }
    .hammer-strike.impact { animation:hammerImpactRebound .24s cubic-bezier(.16,.78,.25,1) forwards; }
    .hammer-strike.leaving { animation:hammerLeave .18s ease-in forwards; }
    @keyframes hammerPrepare { 0% { opacity:0; transform:translate(-17.6%,-76%) rotate(-24deg) scale(.9); } 14% { opacity:1; transform:translate(-17.6%,-76%) rotate(-24deg) scale(1); } 34% { opacity:1; transform:translate(-17.6%,-76%) rotate(-18deg) scale(1); } 100% { opacity:1; transform:translate(-17.6%,-76%) rotate(55deg) scale(1); } }
    @keyframes hammerSlam { 0% { opacity:1; transform:translate(-17.6%,-76%) rotate(55deg) scale(1); } 38% { transform:translate(-17.6%,-76%) rotate(43deg) scale(1); } 78% { transform:translate(-17.6%,-76%) rotate(-8deg) scale(1); } 100% { opacity:1; transform:translate(-17.6%,-76%) rotate(-24deg) scale(1); } }
    @keyframes hammerImpactRebound { 0% { opacity:1; transform:translate(-17.6%,-76%) rotate(-24deg) scale(1); } 42% { transform:translate(-17.6%,-76%) rotate(-13deg) scale(1); } 100% { opacity:1; transform:translate(-17.6%,-76%) rotate(-24deg) scale(1); } }
    @keyframes hammerLeave { from { opacity:1; transform:translate(-17.6%,-76%) rotate(-24deg) scale(1); } 45% { opacity:1; transform:translate(-17.6%,-76%) rotate(8deg) scale(.94); } to { opacity:0; transform:translate(-17.6%,-76%) rotate(42deg) scale(.76); } }
    .hammer-impact { position:absolute; z-index:43; width:10%; aspect-ratio:1; border-radius:50%; transform:translate(-50%,-50%) scale(.25); background:radial-gradient(circle,#fffbd8 0 12%,#f5d78d99 13% 30%,transparent 31%); box-shadow:0 0 0 2px #fff2bd80; pointer-events:none; animation:hammerImpactBurst .28s ease-out forwards; }
    @keyframes hammerImpactBurst { 0% { opacity:1; transform:translate(-50%,-50%) scale(.25); } 55% { opacity:.8; transform:translate(-50%,-50%) scale(.82); } 100% { opacity:0; transform:translate(-50%,-50%) scale(1.25); } }
    #game.impact-shake { animation:impactShake .18s ease-out; }
    @keyframes impactShake { 0%,100% { transform:translate(0,0); } 18% { transform:translate(-3px,1px); } 36% { transform:translate(3px,-1px); } 54% { transform:translate(-2px,-1px); } 72% { transform:translate(2px,1px); } 88% { transform:translate(-1px,0); } }
    #wallet.changed { animation:walletChange .48s ease-out; }
    @keyframes walletChange { 35% { transform:scale(1.13); box-shadow:0 0 0 7px #fff7a866,0 4px 10px #234b2470; } }
    .confetti { position:absolute; z-index:42; top:-5%; width:8px; height:18px; border-radius:2px; background:var(--color); pointer-events:none; animation:confettiFall var(--duration) linear forwards; }
    @keyframes confettiFall { 0% { opacity:1; transform:translate3d(0,-20px,0) rotate(0deg); } 100% { opacity:.95; transform:translate3d(var(--drift),108vh,0) rotate(var(--spin)); } }
    #rewardReel { position:absolute; z-index:48; width:min(70%,350px); height:clamp(76px,9.4vh,98px); height:clamp(76px,9.4dvh,98px); transform:translate(-50%,-100%); pointer-events:none; }
    #rewardReel[hidden] { display:none; }
    #rewardReel::before, #rewardReel::after { content:none; }
    .reward-reel-window { position:relative; width:100%; height:100%; overflow:hidden; border:3px solid rgba(255,255,255,.92); border-radius:999px; background:rgba(250,249,228,.96); box-shadow:0 4px 10px #234b2470; }
    .reward-reel-window::after { content:""; position:absolute; z-index:3; inset:0; border-radius:inherit; background:linear-gradient(180deg,#ffffff66 0%,transparent 42%); pointer-events:none; }
    .reward-reel-track { --slot-h:80px; --reel-end:-560px; width:100%; height:max-content; transform:translate3d(0,0,0); will-change:transform; }
    #rewardReel.rolling .reward-reel-track { animation:rewardRoll 1s cubic-bezier(.1,.67,.14,1) forwards; }
    #rewardReel.rolling:not(.settled) .reward-reel-track { filter:blur(.35px); }
    .reward-choice { width:100%; height:var(--slot-h); display:flex; align-items:center; justify-content:center; gap:clamp(8px,3vw,18px); color:#555; font-family:"MuseoModerno",sans-serif; font-size:clamp(30px,8vw,50px); line-height:1; font-weight:900; }
    .reward-choice img { width:29%; max-height:76%; object-fit:contain; filter:drop-shadow(0 3px 2px #20352145); }
    .reward-choice.hammer img { width:35%; max-height:83%; }
    .reward-choice.plus span { color:#08b92a; }
    .reward-choice.minus span { color:#f22525; }
    .reward-choice.hammer span { color:#555; }
    #rewardReel.settled .reward-choice.final { opacity:1; animation:rewardResultPop .42s cubic-bezier(.15,.8,.25,1) both; }
    #rewardReel.settled .reward-reel-window { animation:rewardPanelLock .34s cubic-bezier(.15,.8,.25,1) both; }
    @keyframes rewardRoll { from { transform:translate3d(0,0,0); } to { transform:translate3d(0,var(--reel-end),0); } }
    @keyframes rewardResultPop { 0% { transform:scale(.84); filter:brightness(1); } 48% { transform:scale(1.1); filter:brightness(1.24); } 100% { transform:scale(1); filter:brightness(1.06); } }
    @keyframes rewardPanelLock { 0% { transform:scale(.98); } 48% { transform:scale(1.025); } 100% { transform:scale(1); } }
    #tutorialHand { position:absolute; z-index:24; left:45.9%; top:42.4%; width:18%; aspect-ratio:1; pointer-events:none; animation:tutorialDrag 2.05s cubic-bezier(.32,.08,.22,1) infinite; will-change:transform,opacity; }
    #tutorialHand[hidden] { display:none; }
    #tutorialHand img { display:block; width:100%; height:100%; object-fit:contain; transform-origin:23% 9%; filter:drop-shadow(0 5px 4px #4b321f55); animation:tutorialPress 2.05s ease-in-out infinite; }
    @keyframes tutorialDrag {
      0%,9% { opacity:0; transform:translate(0,0); }
      16%,34% { opacity:1; transform:translate(0,0); }
      62%,72% { opacity:1; transform:translate(44.6%,-34.4%); }
      82% { opacity:0; transform:translate(44.6%,-34.4%); }
      83%,100% { opacity:0; transform:translate(0,0); }
    }
    @keyframes tutorialPress { 0%,21%,100% { transform:scale(1); } 29% { transform:scale(.955); } 39% { transform:scale(1); } }
    @media (prefers-reduced-motion:reduce) { #tutorialHand, #tutorialHand img { animation:none; } }
    #retry { position:absolute; z-index:49; left:50%; top:71%; width:42%; min-height:clamp(54px,6.8vh,68px); min-height:clamp(54px,6.8dvh,68px); transform:translate(-50%,-50%); border:3px solid rgba(255,255,255,.94); background:rgba(250,249,228,.97); color:#305122; border-radius:999px; box-shadow:0 5px 0 #d7d5ba,0 9px 18px #17391b70; font-family:"MuseoModerno",sans-serif; font-size:clamp(25px,6.8vw,38px); font-weight:900; letter-spacing:.035em; line-height:1; cursor:pointer; animation:retryPop .46s cubic-bezier(.16,.82,.22,1.18) both; }
    #retry[hidden] { display:none; }
    #retry:active { transform:translate(-50%,calc(-50% + 4px)) scale(.97); box-shadow:0 2px 0 #d7d5ba,0 5px 10px #17391b66; }
    #retry:focus-visible { outline:4px solid #79c849; outline-offset:4px; }
    @keyframes retryPop { 0% { opacity:0; transform:translate(-50%,-42%) scale(.62); } 62% { opacity:1; transform:translate(-50%,-53%) scale(1.08); } 100% { opacity:1; transform:translate(-50%,-50%) scale(1); } }
    #toast { position:absolute; z-index:30; left:50%; top:17%; width:max-content; max-width:none; transform:translateX(-50%) scale(.8); padding:4px 8px; opacity:0; color:#fff; background:none; border:0; border-radius:0; white-space:nowrap; text-align:center; font-family:"MuseoModerno",sans-serif; font-size:clamp(23px,6.5vw,38px); font-weight:850; letter-spacing:.015em; text-shadow:0 3px 0 #278c42,0 5px 9px #173d207d; box-shadow:none; pointer-events:none; }
    #toast.show { animation: toast .9s ease-out; }
    @keyframes toast { 0% { opacity:0; transform:translateX(-50%) scale(.4); } 22%,72% { opacity:1; transform:translateX(-50%) scale(1); } 100% { opacity:0; transform:translateX(-50%) scale(1.12); } }
  </style>
</head>
<body>
  <main id="game" aria-label="Garden match-3 road game">
    <img id="bg" src="background-no-inner-shadows.webp" alt="">
    <div id="loading">LOADING...</div>
    <section id="hud">
      <div id="wallet" class="pill"><img src="cash.webp" alt=""><span id="walletAmount">0</span></div>
      <button id="reset" class="pill" aria-label="Restart game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg></button>
    </section>
    <span id="counter" aria-hidden="true">0/20</span>
    <div id="hint" class="pill">SWAP TO MATCH 3</div>
    <div id="moveResult"><img src="road-stone-v2.webp" alt=""><span>x0</span></div>
    <div id="road"></div>
    <div id="board"></div>
    <div id="tutorialHand" aria-hidden="true"><img src="tutorial-hand.webp" alt=""></div>
    <div id="heroShadow"></div>
    <img id="hero" src="character.webp" alt="Player">
    <div id="fx"></div>
    <img id="moneyLabel" src="reward-100.webp" alt="+100">
    <button id="retry" type="button" aria-label="Restart game" hidden>RETRY</button>
    <div id="rewardReel" aria-live="assertive" hidden>
      <div class="reward-reel-window"><div id="rewardReelTrack" class="reward-reel-track"></div></div>
    </div>
    <div id="toast">GREAT!</div>
  </main>
  <script>
    (() => {
      const game = document.querySelector('#game');
      const boardEl = document.querySelector('#board');
      const roadEl = document.querySelector('#road');
      const hero = document.querySelector('#hero');
      const heroShadow = document.querySelector('#heroShadow');
      const moneyLabel = document.querySelector('#moneyLabel');
      const hint = document.querySelector('#hint');
      const moveResult = document.querySelector('#moveResult');
      const toast = document.querySelector('#toast');
      const counter = document.querySelector('#counter');
      const walletAmount = document.querySelector('#walletAmount');
      const wallet = document.querySelector('#wallet');
      const rewardReel = document.querySelector('#rewardReel');
      const rewardReelTrack = document.querySelector('#rewardReelTrack');
      const tutorialHand = document.querySelector('#tutorialHand');
      const retry = document.querySelector('#retry');
      const asset = 'tile-blue.webp';
      const yellowAsset = 'tile-yellow.webp';
      const roadAsset = 'road-stone-v2.webp';
      const shatteredRoadAsset = 'road-stone-split.webp';
      const hammerAsset = 'hammer-tool.webp';
      const heroFrontAsset = 'character.webp';
      const heroBackAsset = 'character-back.webp';
      const heroCelebrateJumpAsset = 'character-celebrate-jump.webp';
      const SIZE = 4;
      let grid, tiles, selected, busy, roadIndex, heroIndex, nextId, refillSeed, tutorialDone, clearRounds, roadQueue, runId=0, celebrateTimer, celebrateFrameTimer, retryTimer, moneyTotal;
      let occupiedRoad, pendingRoadCount, roadPlacementHistory, roadRepairUnlocked, roadQueueEpoch, roadBlockedUntilFreshMatch, mysteryGateCanceledCount, forcedMysteryRewardForTest, mysteryEl, mysteryCollected, mysteryLocked, lastMysteryReward, lastHammered, celebrating;
      let dragStart = null;
      const cashAt = new Set([2, 6, 9, 12]);

        celebrateFrameTimer=setInterval(()=>{ jumpFrame=!jumpFrame; hero.src=jumpFrame?heroCelebrateJumpAsset:heroFrontAsset; },290);
        throwConfetti(44); celebrateTimer=setInterval(()=>throwConfetti(12),650);
        clearTimeout(retryTimer); retryTimer=setTimeout(()=>{ if(celebrationRun===runId) retry.hidden=false; },720);
      }
      async function collectCash(idx,p) {
        const el=cashEls.get(idx); if(el) { el.classList.add('collected'); el._hoverShadow?.classList.add('collected'); }
        moneyTotal+=100; walletAmount.textContent=moneyTotal;
        moneyLabel.style.left=p.x+'%'; moneyLabel.style.top=(p.y-8)+'%'; moneyLabel.classList.remove('show'); void moneyLabel.offsetWidth; moneyLabel.classList.add('show');
        for(let i=0;i<14;i++) {
          const bill=document.createElement('i'); bill.className='bill'; bill.style.left=p.x+'%'; bill.style.top=(p.y-8)+'%';
          bill.style.setProperty('--dx',(Math.random()*110-55)+'px'); bill.style.setProperty('--dy',(Math.random()*85+30)+'px'); bill.style.setProperty('--rot',(Math.random()*500-250)+'deg');
          bill.style.animationDelay=(Math.random()*.18)+'s'; document.querySelector('#fx').appendChild(bill); setTimeout(()=>bill.remove(),1150);
        }
        await sleep(720); if(el) { el._hoverShadow?.remove(); el.remove(); }
      }
      function updateProgress() { counter.textContent=roadIndex+'/'+route.length; }
      function flash(text) { toast.textContent=text; toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show'); }
      function showMoveResult(count) { moveResult.querySelector('span').textContent='x'+count; moveResult.classList.remove('show'); void moveResult.offsetWidth; moveResult.classList.add('show'); }
      function renderGameToText() {
        return JSON.stringify({
          coordinateSystem:'route indices begin at 0; new stones target unfilled slots ahead of the hero first, then hammer-created gaps behind; hammer removes a random consecutive run behind the hero',
          money:moneyTotal, heroIndex, road:{occupied:[...occupiedRoad].sort((a,b)=>a-b),pending:pendingRoadCount,recentPlacements:roadPlacementHistory.slice(-12),repairUnlocked:roadRepairUnlocked,blockedUntilFreshMatch:roadBlockedUntilFreshMatch,queueEpoch:roadQueueEpoch,lastMatchStartEpoch:Number(game.dataset.lastMatchStartEpoch),staleMatchRejected:game.dataset.staleMatchRejected==='true',nextTarget:nextRoadTargetIndex(roadRepairUnlocked),count:occupiedRoad.size,total:route.length},
          mystery:{index:mysteryAt,collected:mysteryCollected,locked:mysteryLocked,reelOpen:!rewardReel.hidden,reelPhase:rewardReel.className,rewardOdds:mysteryRewardOdds,lastReward:lastMysteryReward,lastHammered:lastHammered,canceledPreGateStones:mysteryGateCanceledCount,protectedRightmost:[...occupiedRoad].filter(idx=>idx>=0&&idx<heroIndex).reduce((best,idx)=>best===null||route[idx].x>route[best].x?idx:best,null),activeHammers:document.querySelectorAll('.hammer-strike').length,activeShatteredStones:[...document.querySelectorAll('.road-tile.shattered')].map(el=>Number(el.dataset.roadIndex))},
          inputLocked:busy||mysteryLocked,tutorial:{handVisible:!tutorialHand.hidden,automaticTileGlow:false,dragFrom:{row:1,col:1},dragTo:{row:0,col:1},gesture:'press-drag-release-reset'},ending:{celebrating,retryVisible:!retry.hidden}
        });
      }
      function seedRoadForTest(count=11) {
        roadQueueEpoch++; document.querySelectorAll('.road-tile,.fly-tile,.pave-tile').forEach(el=>el.remove()); occupiedRoad.clear(); pendingRoadCount=0; roadPlacementHistory=[]; roadRepairUnlocked=false; roadBlockedUntilFreshMatch=false; mysteryGateCanceledCount=0; setRoadFreshMatchBlock(false); game.dataset.mysteryGateCanceledCount='0';
        const capped=Math.max(0,Math.min(route.length,Math.round(count)));
        for(let idx=0;idx<capped;idx++) { const stone=new Image(); stone.src=roadAsset; place(stone,route[idx]); settleRoadElement(stone,idx); occupiedRoad.add(idx); }
        roadIndex=occupiedRoad.size; heroIndex=capped-1; setHero(heroIndex>=0?route[heroIndex]:heroStart); updateProgress();
      }
      async function refillRoadForTest(count=3,asFreshMatch=false) {
        if(asFreshMatch) setRoadFreshMatchBlock(false);
        if(roadBlockedUntilFreshMatch) return;
        const allowRepair=roadRepairUnlocked,capacity=Math.max(0,roadCapacity(allowRepair)-pendingRoadCount),total=Math.min(capacity,Math.max(0,Math.round(count))),matches=Array.from({length:total},()=>({r:0,c:0}));
        if(matches.length) { const batchEpoch=roadQueueEpoch; pendingRoadCount+=matches.length; await layRoadBatch(matches,runId,false,allowRepair,batchEpoch); }
      }
      window.render_game_to_text=renderGameToText;
      window.__gardenTest={seedRoad:seedRoadForTest,refillRoad:refillRoadForTest,resumeAfterFreshMatch:(count=3)=>refillRoadForTest(count,true),triggerMystery:(type='hammer',count=3,start=null)=>{void collectMystery({type,count,start,amount:100});}};

      game.addEventListener('pointerdown',e=>{ if(mysteryLocked)return; const t=tileFromTarget(e.target); if(t) { dragStart={t,x:e.clientX,y:e.clientY,pointerId:e.pointerId}; if(game.setPointerCapture) game.setPointerCapture(e.pointerId); } });
      game.addEventListener('pointerup',e=>{
        if(!dragStart) return; const {t,x,y}=dragStart; dragStart=null; const dx=e.clientX-x, dy=e.clientY-y;
        if(game.releasePointerCapture&&game.hasPointerCapture&&game.hasPointerCapture(e.pointerId)) game.releasePointerCapture(e.pointerId);
        if(mysteryLocked) return;
        if(Math.hypot(dx,dy)<16) { select(t); return; }
        const candidates=[...tiles.values()].filter(o=>adjacent(t,o));
        let best=null,score=0; for(const o of candidates){const a=pos(t.r,t.c),b=pos(o.r,o.c),vx=b.x-a.x,vy=b.y-a.y,s=vx*dx+vy*dy;if(s>score){score=s;best=o;}}
        if(best) { if(selected){selected.el.classList.remove('selected');selected=null;} attemptSwap(t,best); }
      });
      game.addEventListener('pointercancel',e=>{ dragStart=null; if(game.releasePointerCapture&&game.hasPointerCapture&&game.hasPointerCapture(e.pointerId)) game.releasePointerCapture(e.pointerId); });
      document.querySelector('#reset').onclick=reset;
      retry.onclick=reset;
      const waitForImage=img=>{
        if(img.complete) return Promise.resolve();
        if(typeof img.decode==='function') return img.decode().catch(()=>{});
        return new Promise(resolve=>{ img.addEventListener('load',resolve,{once:true}); img.addEventListener('error',resolve,{once:true}); });
      };
      Promise.all([...document.images].map(waitForImage)).then(()=>{
        const loading=document.querySelector('#loading'); loading.style.opacity=0; setTimeout(()=>loading.remove(),260); reset();
        const params=new URLSearchParams(location.search),qaType=params.get('qaMystery'),qaSelect=params.get('qaSelect'),qaRoad=Number(params.get('qaRoad'))||0,qaSeed=params.has('qaSeed')?Number(params.get('qaSeed')):NaN,qaDelay=Math.max(80,Number(params.get('qaDelay'))||80),qaGate=params.has('qaGate'),qaGateRefill=Math.max(0,Number(params.get('qaGateRefill'))||0),qaGateReward=params.get('qaGateReward'),qaOverlap=params.has('qaOverlap'),qaFinish=params.has('qaFinish'),qaOdds=Math.max(0,Math.min(100000,Number(params.get('qaOdds'))||0));
        if(qaOdds) { const counts={hammer:0,plus:0,minus:0}; for(let i=0;i<qaOdds;i++) counts[rollMysteryReward().type]++; game.dataset.qaRewardSample=JSON.stringify({rolls:qaOdds,counts}); }
        if(['yellow','blue','red'].includes(qaSelect)) setTimeout(()=>select([...tiles.values()].find(t=>colorClass(t.color)===qaSelect)),80);
        if(qaFinish) { seedRoadForTest(route.length-1); tutorialDone=true; tutorialHand.hidden=true; hint.style.display='none'; mysteryCollected=true; mysteryEl?.remove(); setTimeout(()=>refillRoadForTest(1),qaDelay); }
        else if(qaRoad>0&&!qaType&&!qaGate) { if(Number.isFinite(qaSeed)) seedRoadForTest(qaSeed); setTimeout(()=>refillRoadForTest(qaRoad),qaDelay); }
        if(qaGate) {
          seedRoadForTest(9); forcedMysteryRewardForTest=qaGateReward==='hammer'?{type:'hammer',count:1,start:0}:{type:'plus',amount:100};
          setTimeout(async()=>{ await refillRoadForTest(3); if(qaGateRefill>0) { await sleep(500); await refillRoadForTest(qaGateRefill,true); } },qaDelay);
          if(qaOverlap) setTimeout(()=>{ const move=findLegalMove(); if(move) void attemptSwap(...move); },qaDelay+700);
        }
        if(['plus','minus','hammer'].includes(qaType)) {
          const qaCount=Number(params.get('count'))||3,qaStart=params.has('start')?Number(params.get('start')):NaN,qaMoney=Number(params.get('qaMoney')??params.get('money')),qaRefill=Number(params.get('qaRefill'))||0,qaPending=Number(params.get('qaPending'))||0; seedRoadForTest(11);
          if(Number.isFinite(qaMoney)&&qaMoney>=0) { moneyTotal=Math.round(qaMoney); walletAmount.textContent=moneyTotal; }
          setTimeout(async()=>{
            const rewardPromise=collectMystery({type:qaType,count:qaCount,amount:100,start:Number.isInteger(qaStart)?qaStart:null});
            const pendingCanRepair=roadRepairUnlocked,pendingTotal=Math.min(Math.max(0,roadCapacity(pendingCanRepair)-pendingRoadCount),Math.max(0,Math.round(qaPending)));
            if(pendingTotal) pendingRoadCount+=pendingTotal;
            await rewardPromise;
            if(pendingTotal) await layRoadBatch(Array.from({length:pendingTotal},()=>({r:0,c:0})),runId,true,pendingCanRepair);
            if(qaRefill>0) await refillRoadForTest(qaRefill);
          },qaDelay);
        }
      });
    })();
  </script>
